name: Publish Sparkle feed

on:
  push:
    branches: [main]
    paths:
      - appcast.xml
      - .github/workflows/publish-feed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preserve feed line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out feed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and stage feed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET
          source = Path('appcast.xml')
          items = ET.parse(source).findall('./channel/item')
          assert items, 'Appcast has no updates'
          ns = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          for item in items:
              assert int(item.findtext(ns + 'version')) > 0
              enclosure = item.find('enclosure')
              assert enclosure.get('url').startswith('https://github.com/shakeandspeak/scribe-updates/releases/download/')
              assert int(enclosure.get('length')) > 0
              assert enclosure.get(ns + 'edSignature'), 'Update signature is missing'
          Path('_site').mkdir()
          shutil.copy2(source, '_site/appcast.xml')
          shutil.copy2('README.md', '_site/README.md')
          PY

      - name: Upload feed
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy feed
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify public feed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import time
          expected = Path('appcast.xml').read_bytes()
          url = 'https://shakeandspeak.github.io/scribe-updates/appcast.xml?deployment=' + os.environ['GITHUB_SHA']
          for attempt in range(24):
              result = subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', url], capture_output=True)
              if result.returncode == 0 and result.stdout == expected:
                  print('Public appcast matches the deployed commit.')
                  break
              time.sleep(5)
          else:
              raise SystemExit('Public appcast did not update to this commit')
          PY
